name: Build, test and deploy site
# Every push builds the Astro site, generates the resume PDF from the same data,
# and runs Lighthouse, axe accessibility and link checks. Only pushes to main deploy.
on:
  push:
    branches: [main, astro-rebuild]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Sensitive-data scan of build output
        # Term list lives in an encrypted repository secret, never in this public repo.
        # grep -l prints file names only, so matches are not echoed into public logs.
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          GENERIC='\b(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b|S-1-5-21-[0-9]{6,}'
          if grep -rIEl "$GENERIC" dist; then echo "::error::Private IP address or Windows SID found in build output"; exit 1; fi
          if [ -z "$PII_PATTERNS" ]; then echo "::warning::PII_PATTERNS secret not set; dictionary scan skipped"; exit 0; fi
          if grep -rIPil "$PII_PATTERNS" dist; then echo "::error::Private dictionary term found in build output"; exit 1; fi
          echo "Sensitive-data scan clean"
      - name: Install Chromium for PDF and accessibility checks
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview > preview.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4321/ -t 60000
      - name: Generate resume PDF
        run: npm run resume:pdf
      - name: Accessibility (axe, WCAG 2.2 AA, light + dark)
        run: npm run test:a11y
      - name: Lighthouse (min 95 in every category)
        run: npx --yes @lhci/cli@0.14.x autorun
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --root-dir ${{ github.workspace }}/dist
            --exclude 'linkedin\.com' --exclude 'linktr\.ee' --exclude '^mailto:' --exclude '^tel:'
            --exclude '^https://forrestswan3\.github\.io/'
            --accept 200,206,429
            'dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
